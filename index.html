<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Box Model</title>
</head>
<body>
    <header role="banner">
        <h1>Box Model</h1>
    </header>
    <main role="main">
        <div class="box">
            <h2>Box 1</h2>
            <p>This box has a 2px border, 20px padding, and 10px margin</p>
        </div>
        <div class="box">
            <h2>Box 2</h2>
            <p>Same settings, placed side-by-side with an inline-block display</p>
        </div>
    </main>
</body>
</html>
